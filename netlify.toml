# Publicacao a partir do GitHub.
# O site e estatico: nao ha nada para compilar, so servir a pasta "site".

[build]
  publish = "site"
  command = ""

# O site e publicado na Vercel (ver vercel.json). Este arquivo fica so como
# reserva: se um dia voltar para a Netlify, ja esta valido.
#
# Funcoes de servidor (a unica parte que nao e estatica): recebem o pagamento
# pelo Mercado Pago sem expor nenhuma chave ao navegador.
#   api/criar-cobranca-pix       gera o QR Pix dinamico da inscricao pendente
#   api/webhook-mercadopago-pix  recebe o aviso de Pix pago e confirma a inscricao
# Precisam das variaveis MERCADOPAGO_* e SUPABASE_* no painel da hospedagem.
# Sem elas, o site cai sozinho na cobranca manual antiga.
[functions]
  directory = "api"
  node_bundler = "esbuild"

# Cabecalhos de seguranca do site publicado.
#
# A Content-Security-Policy e a linha de defesa se algum dia entrar um erro de
# programacao que deixe passar texto de terceiro como codigo: mesmo assim, o
# navegador so executa script vindo do proprio site (script-src 'self'), so
# conversa com o Supabase (connect-src) e nao deixa a pagina ser embutida em
# outro site (frame-ancestors 'none'). O site nao carrega nenhum JavaScript de
# CDN — o do Supabase e uma copia local em site/vendor/ — entao 'self' basta.
# A unica excecao e challenges.cloudflare.com: o widget do Turnstile (CAPTCHA
# opcional da tela de Entrar). Ele so e baixado se turnstileSiteKey estiver
# preenchida no config.js; com ela vazia, nada de challenges.cloudflare.com
# chega a carregar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
