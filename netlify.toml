# Publicacao a partir do GitHub.
# O site e estatico: nao ha nada para compilar, so servir a pasta "site".

[build]
  publish = "site"
  command = ""

# Cabecalhos de seguranca basicos para o site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
