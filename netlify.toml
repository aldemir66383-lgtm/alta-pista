# Publicacao a partir do GitHub.
# O site e estatico: nao ha nada para compilar, so servir a pasta "site".

[build]
  publish = "site"
  command = ""

# Cabecalhos de seguranca do site publicado.
#
# A Content-Security-Policy e a linha de defesa se algum dia entrar um erro de
# programacao que deixe passar texto de terceiro como codigo: mesmo assim, o
# navegador so executa script vindo do proprio site (script-src 'self'), so
# conversa com o Supabase (connect-src) e nao deixa a pagina ser embutida em
# outro site (frame-ancestors 'none'). O site nao carrega nenhum JavaScript de
# CDN — o do Supabase e uma copia local em site/vendor/ — entao 'self' basta.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
